<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glucotchi Runner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="justify-content: center; overflow: hidden;">

    <div class="neu-card" style="width: 100%; max-width: 600px; text-align: center;">
        
        <div class="card-header" style="justify-content: center; margin-bottom: 10px;">
            <span class="card-title">🏜️ DESERTO GLUCOTCHI</span>
        </div>

        <div style="display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 0.9rem;">
            <div>Glicemia: <strong id="hud-glicemia" style="color: var(--target-color);">--</strong> mg/dL</div>
            <div id="hud-status" style="color: var(--gold);">Carregando piloto...</div>
        </div>

        <div id="game-wrapper" onclick="pular()">
            <div id="placar-jogo">Score: <span id="pontuacao">0</span></div>
            
            <div id="kalango-personagem"></div>
            <div id="obstaculo"></div>
            
            <div id="tela-overlay">
                <h2 id="texto-overlay" style="color: var(--text-main); margin-bottom: 15px;">CARREGANDO DADOS...</h2>
                <button id="btn-iniciar" class="btn-buy" style="display: none; width: 60%; margin: 0 auto;" onclick="iniciarJogo()">INICIAR CORRIDA</button>
            </div>
        </div>

        <p style="color: var(--text-muted); font-size: 0.8rem; margin-top: 15px;">Toque na tela do jogo para pular!</p>
        
        <button class="btn-buy" style="margin-top: 20px; background: transparent; border-color: var(--text-muted); color: var(--text-muted);" onclick="window.history.back()">⬅ Voltar ao Painel</button>

    </div>

    <script src="jogo.js"></script>
</body>
</html>
