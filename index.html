<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saymon's Glucotchi Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="topbar">
        <div class="user-greeting">Hi, <span id="user-name">Saymon</span>!</div>
        <div class="economy">
            <span class="coin-icon">🔥</span>
            <span id="coin-balance">3000</span> Glucocoins
            <button id="btn-store">🛒 Store</button>
        </div>
    </div>

    <div class="main-container">
        <div class="neu-card dashboard-card status-high" id="glucotchi-card">
            <div class="card-title">Status Card</div>
            
            <div class="glucose-header">
                <div class="glucose-value-container">
                    <span id="bg-value">229</span>
                    <span class="unit">mg/dL</span>
                </div>
                
                <div class="rate-gauge">
                    <span class="rate-label">RATE</span>
                    <div class="gauge-arc">
                        <span class="trend-arrow" id="trend">→</span>
                    </div>
                </div>
            </div>

            <div class="avatar-container" id="avatar-container">
                <div id="avatar" class="avatar-emoji">🥵</div> 
            </div>

            <div class="coach-section">
                <div class="drone-icon">🤖</div>
                <div class="coach-bubble">
                    <span class="coach-name">Coach AI Drone</span>
                    <div id="message">"Maximum thermal overload detected. Power levels are highly unstable. Countersign needed. Manage this heat!"</div>
                </div>
            </div>
        </div>

        <div class="neu-card podium-card">
            <h2>🏆 TOP PILOTS</h2>
            <div class="podium-list" id="podium-container">
                </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
