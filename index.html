<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glucotchi Play</title>
    <link rel="stylesheet" href="style.css?v=12">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header class="play-header">
        <div class="player-profile">
            <span class="player-avatar-mini">🔥</span>
            <div class="player-info">
                <span class="player-title">PILOTO</span>
                <span id="user-name" class="player-name">Saymon</span>
            </div>
        </div>
        <div class="play-stats">
            <div class="stat-pill orange-pill">
                <span class="stat-icon">🔥</span>
                <span id="streak-count" class="stat-value">0</span>
            </div>
            <div class="stat-pill blue-pill" onclick="toggleStore()">
                <span class="stat-icon">💎</span>
                <span id="coin-balance" class="stat-value">0</span>
            </div>
            <button id="btn-voz" onclick="alternarVoz()" class="btn-audio-play">🔊</button>
        </div>
    </header>

    <main class="play-container">
        
        <div id="tab-home" class="tab-content active">
            
            <div class="neu-card dashboard-card status-target" id="glucotchi-card">
                
                <div class="card-top-bar">
                    <span class="card-badge">NÍVEL DE KI</span>
                    <span class="trend-icon" id="trend">--</span>
                </div>

                <div class="glucose-hero">
                    <span id="bg-value" class="glucose-big">--</span>
                    <span class="glucose-unit">mg/dL</span>
                </div>
                
                <div class="stage-container">
                    <div id="avatar-container" class="avatar-stage">
                        <div id="avatar" class="avatar-emoji">😎</div>
                    </div>
                    <div class="stage-shadow"></div>
                </div>

                <div class="xp-play-section">
                    <div class="xp-play-header">
                        <span class="xp-label">EXPERIÊNCIA</span>
                        <span class="xp-numbers"><span id="xp-value">0</span>/100</span>
                    </div>
                    <div class="xp-play-track">
                        <div class="xp-play-fill" id="xp-bar"></div>
                    </div>
                </div>

                <div class="robot-chat">
                    <div class="robot-head">🤖</div>
                    <div class="robot-bubble">
                        <p id="message">A carregar os sistemas de combate...</p>
                    </div>
                </div>

            </div>
        </div>

        <div id="tab-chart" class="tab-content" style="display: none;">
            <div class="neu-card chart-play-card">
                <h2 class="play-title">Radar de Batalha</h2>
                <div class="chart-box">
                    <canvas id="glicemiaChart"></canvas>
                </div>
            </div>

            <div class="neu-card log-play-card">
                <h2 class="play-title">Diário de Bordo</h2>
                <div id="narrativa-log" class="log-play-container">
                    <p class="log-entry">A ligar radares...</p>
                </div>
            </div>
        </div>

        <div id="tab-podium" class="tab-content" style="display: none;">
            <div class="neu-card podium-play-card">
                <h2 class="play-title">Top Pilotos</h2>
                <div id="podium-container" class="podium-play-list"></div>
            </div>
        </div>

        <div id="tab-jogos" class="tab-content" style="display: none;">
            <div class="arcade-play-header">
                <h2>ESCOLHE O TEU JOGO!</h2>
            </div>
            
            <div class="arcade-play-grid">
                <div class="neu-card game-play-card" onclick="window.location.href='jogo.html'">
                    <div class="game-play-icon bg-green">🏃‍♂️</div>
                    <h3>Deserto Run</h3>
                    <button class="btn-play-action">JOGAR</button>
                </div>

                <div class="neu-card game-play-card" onclick="window.location.href='flappy.html'">
                    <div class="game-play-icon bg-blue">🦅</div>
                    <h3>Flappy Bird</h3>
                    <button class="btn-play-action">JOGAR</button>
                </div>
            </div>
        </div>

    </main>

    <nav class="bottom-nav play-nav">
        <button class="nav-item active" onclick="mudarAba('tab-home', this)">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Início</span>
        </button>
        <button class="nav-item" onclick="mudarAba('tab-chart', this)">
            <span class="nav-icon">📊</span>
            <span class="nav-label">Estatísticas</span>
        </button>
        <button class="nav-item" onclick="mudarAba('tab-podium', this)">
            <span class="nav-icon">🏆</span>
            <span class="nav-label">Ranking</span>
        </button>
        <button class="nav-item" onclick="mudarAba('tab-jogos', this)">
            <span class="nav-icon">🎮</span>
            <span class="nav-label">Arcade</span>
        </button>
        <button class="nav-item" onclick="toggleStore()">
            <span class="nav-icon">🛒</span>
            <span class="nav-label">Loja</span>
        </button>
    </nav>

    <div id="store-modal" class="modal-play-backdrop" style="display: none;">
        <div class="neu-card modal-play-content">
            <div class="modal-play-header">
                <h2>LOJA DE SKINS</h2>
                <button class="btn-play-close" onclick="toggleStore()">✖</button>
            </div>
            
            <div class="shop-play-grid">
                <div class="shop-play-item">
                    <img src="freeza.gif" class="shop-img">
                    <h4>Freeza</h4>
                    <button class="btn-play-buy" onclick="buyItem('freeza.gif', 500)">500 💎</button>
                </div>
                <div class="shop-play-item">
                    <img src="yuta.gif" class="shop-img">
                    <h4>Yuta</h4>
                    <button class="btn-play-buy" onclick="buyItem('yuta.gif', 1000)">1000 💎</button>
                </div>
                <div class="shop-play-item">
                    <img src="ds.gif" class="shop-img">
                    <h4>Tanjiro</h4>
                    <button class="btn-play-buy" onclick="buyItem('ds.gif', 1500)">1500 💎</button>
                </div>
                <div class="shop-play-item">
                    <img src="one piece.gif" class="shop-img">
                    <h4>Luffy</h4>
                    <button class="btn-play-buy" onclick="buyItem('one piece.gif', 2000)">2000 💎</button>
                </div>
                <div class="shop-play-item">
                    <img src="neymar.png" class="shop-img">
                    <h4>Neymar</h4>
                    <button class="btn-play-buy" onclick="buyItem('neymar.png', 2500)">2500 💎</button>
                </div>
                <div class="store-item neu-inset">
                    <img src="itadore.gif" class="item-avatar-img" alt="Skin">
                    <div class="store-info">
                        <h4>Itadori</h4>
                        <button class="btn-buy" onclick="buyItem('Itadore.gif', 2500)">2500 🔥</button>
                    </div>
                </div>

                <div class="store-item neu-inset">
                    <img src="goku.png" class="item-avatar-img" alt="Skin">
                    <div class="store-info">
                        <h4>Goku</h4>
                        <button class="btn-buy" onclick="buyItem('goku.png', 2500)">2500 🔥</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
